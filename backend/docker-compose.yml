services:
  db:
    image: postgres:15-alpine
    container_name: skilltree-db
    environment:
      POSTGRES_DB: skilltree
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123465
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - skilltree-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skilltree"]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build: .
    container_name: skilltree-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/skilltree
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123465

    networks:
      - skilltree-network
    volumes:
      - ./logs:/SkillTree/backend/logs
      - ~/.m2:/root/.m2

networks:
  skilltree-network:
    driver: bridge

volumes:
  pgdata:
